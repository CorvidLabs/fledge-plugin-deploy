[plugin]
name = "fledge-deploy"
version = "0.1.0"
description = "Deploy, rollback, and post-lane notification for fledge workflows"
author = "CorvidLabs"

[[commands]]
name = "deploy"
description = "Deploy current project"
binary = "bin/fledge-deploy"

[[commands]]
name = "rollback"
description = "Rollback to previous deployment"
binary = "bin/fledge-rollback"

[hooks]
post_install = "echo 'fledge-deploy installed successfully'"
